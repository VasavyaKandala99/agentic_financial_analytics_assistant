name: CD - Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: agentic-financial-va
  REGION: us-central1
  REPOSITORY: agentic-assistant
  SERVICE: agentic-financial-assistant
  IMAGE: us-central1-docker.pkg.dev/agentic-financial-va/agentic-assistant/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/788139647444/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@agentic-financial-va.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Push Docker image
        run: docker push $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --port 8000 \
            --quiet